<template>
    <lightning-card title="Account Form" icon-name="standard:account">
        <div class="slds-p-around_medium">

            <!-- Account Name -->
            <lightning-input
                label="Account Name"
                value={accountName}
                onchange={handleChange}
                data-field="accountName"
                required>
            </lightning-input>

            <!-- Account Number -->
            <lightning-input
                class="slds-m-top_medium"
                label="Account Number"
                value={accountNumber}
                onchange={handleChange}
                data-field="accountNumber"
                type="number">
            </lightning-input>

            <!-- Billing Address -->
            <lightning-textarea
                class="slds-m-top_medium"
                label="Billing Address"
                value={billingAddress}
                onchange={handleChange}
                data-field="billingAddress">
            </lightning-textarea>

            <!-- Description -->
            <lightning-textarea
                class="slds-m-top_medium"
                label="Description"
                value={description}
                onchange={handleChange}
                data-field="description">
            </lightning-textarea>

            <!-- Submit Button -->
            <div class="slds-m-top_large slds-text-align_center">
                <lightning-button
                    variant="brand"
                    label="Submit"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
