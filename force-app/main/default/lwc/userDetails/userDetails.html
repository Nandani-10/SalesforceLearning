<template>
    <lightning-card title="User Details Form" icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <!-- Row 1 -->
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="First Name" value={firstName} onchange={handleChange} name="firstName"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Last Name" value={lastName} onchange={handleChange} name="lastName"></lightning-input>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="slds-grid slds-gutters slds-m-top_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Email" type="email" value={email} onchange={handleChange} name="email"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Phone Number" type="tel" value={phone} onchange={handleChange} name="phone"></lightning-input>
                </div>
            </div>

            <!-- Button -->
            <div class="slds-m-top_large slds-align_absolute-center">
                <button class="slds-button slds-button_brand custom-button" onclick={handleSubmit}>Submit</button>
            </div>
        </div>
    </lightning-card>
</template>
