<template>
    <lightning-card title="LDS Client-Side Imperative CRUD (All in One)" class="slds-p-around_medium">

        <!-- GET RECORD -->
        <lightning-input 
            label="Enter Account Id" 
            value={recordId} 
            onchange={handleIdChange}>
        </lightning-input>

        <lightning-button 
            variant="brand" 
            label="Get Record" 
            onclick={handleGetRecord}
            class="slds-m-top_small">
        </lightning-button>

        <template if:true={accName}>
            <p class="slds-m-top_small"><b>Name: </b>{accName}</p>
            <p><b>Phone: </b>{accPhone}</p>
        </template>

        <hr class="slds-m-vertical_medium">

        <!-- UPDATE RECORD -->
        <template if:true={recordId}>
            <lightning-input 
                type="text"
                label="Update Phone"
                value={newPhone}
                onchange={handlePhoneChange}>
            </lightning-input>

            <lightning-button 
                variant="brand" 
                label="Update Record" 
                onclick={handleUpdateRecord}
                class="slds-m-top_small">
            </lightning-button>
        </template>

        <hr class="slds-m-vertical_medium">

        <!-- CREATE RECORD -->
        <h3 class="slds-text-heading_small">Create New Account</h3>
        <lightning-input 
            label="New Account Name" 
            value={newAccName}
            onchange={handleNewAccChange}>
        </lightning-input>

        <lightning-button 
            variant="success" 
            label="Create Account" 
            onclick={handleCreateRecord}
            class="slds-m-top_small">
        </lightning-button>

        <hr class="slds-m-vertical_medium">

        <!-- DELETE RECORD -->
        <template if:true={recordId}>
            <lightning-button 
                variant="destructive" 
                label="Delete Record" 
                onclick={handleDeleteRecord}>
            </lightning-button>
        </template>

        <!-- OUTPUT MESSAGE -->
        <template if:true={message}>
            <p class="slds-m-top_medium slds-text-color_success">
                {message}
            </p>
        </template>

    </lightning-card>
</template>
