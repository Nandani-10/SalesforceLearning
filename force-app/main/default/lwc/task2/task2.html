<template>
    <lightning-card title="Account Form" icon-name="standard:account">
  <div class="slds-p-around_xx-large">
            <lightning-input
                label="Account Name"
                value={accountName}
                onchange={handleChange}
                name="accountName"
                required
            ></lightning-input>
 
            <lightning-input
                label="Account Number"
                type="number"
                value={accountNumber}
                onchange={handleChange}
                name="accountNumber"
            ></lightning-input>
 
            <lightning-textarea
                label="Billing Address"
                value={billingAddress}
                onchange={handleChange}
                name="billingAddress"
            ></lightning-textarea>
 
            <lightning-textarea
                label="Description"
                value={description}
                onchange={handleChange}
                name="description"
            ></lightning-textarea>
 
            <div class="slds-m-top_medium">
                <lightning-button
                    label="Submit"
                    variant="brand"
                    onclick={handleSubmit}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
